<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="LockBox - Offline password generator and secure local vault database.">
    <title>LockBox - Offline Password Generator & Vault</title>
    <!-- Web Padlock Favicon SVG Data URI -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='11' width='18' height='11' rx='2' ry='2'%3E%3C/rect%3E%3Cpath d='M7 11V7a5 5 0 0 1 10 0v4'%3E%3C/path%3E%3C/svg%3E">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root, [data-theme="deep-slate"] {
            --bg-base: #0b0c10;
            --bg-surface: #13151a;
            --bg-elevated: #1c1f26;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --border-subtle: #22252d;
            --accent-primary: #2563eb;
            --accent-hover: #1d4ed8;
            --status-alert: #ef4444;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        [data-theme="paper-light"] {
            --bg-base: #f9fafb;
            --bg-surface: #ffffff;
            --bg-elevated: #f3f4f6;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --border-subtle: #e5e7eb;
            --accent-primary: #0284c7;
            --accent-hover: #0369a1;
            --status-alert: #dc2626;
        }

        [data-theme="tactical-amber"] {
            --bg-base: #000000;
            --bg-surface: #111111;
            --bg-elevated: #222222;
            --text-primary: #ffb703;
            --text-secondary: #fb8500;
            --border-subtle: #333333;
            --accent-primary: #ffb703;
            --accent-hover: #fb8500;
            --status-alert: #d00000;
        }

        [data-theme="industrial-steel"] {
            --bg-base: #2b2d42;
            --bg-surface: #3a3f58;
            --bg-elevated: #4a4e69;
            --text-primary: #edf2f4;
            --text-secondary: #8d99ae;
            --border-subtle: #5c677d;
            --accent-primary: #ef233c;
            --accent-hover: #d90429;
            --status-alert: #ff9f1c;
        }

        [data-theme="organic-earth"] {
            --bg-base: #283618;
            --bg-surface: #606c38;
            --bg-elevated: #4b582b;
            --text-primary: #fefae0;
            --text-secondary: #dda15e;
            --border-subtle: #bc6c25;
            --accent-primary: #dda15e;
            --accent-hover: #bc6c25;
            --status-alert: #e63946;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Clean Header */
        header {
            width: 100%;
            padding: 20px 48px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-subtle);
            background: var(--bg-surface);
            transition: padding 0.3s ease;
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-badge {
            font-size: 11px;
            font-weight: 500;
            padding: 4px 10px;
            border-radius: 4px;
            background: var(--bg-base);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .status-badge.unlocked {
            color: #10b981;
            border-color: rgba(16, 185, 129, 0.2);
            background: rgba(16, 185, 129, 0.05);
        }

        /* Two-Column Layout */
        main {
            flex-grow: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            padding: 32px 48px;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            transition: padding 0.3s ease, gap 0.3s ease;
        }

        /* Handcrafted Flat Panels */
        .panel {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 32px;
            display: flex;
            flex-direction: column;
        }

        .panel-title {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.2px;
            margin-bottom: 24px;
            color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Password Display */
        .password-workspace {
            background: var(--bg-base);
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            min-height: 120px;
        }

        .password-display-wrapper {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .password-text {
            font-family: var(--font-mono);
            font-size: clamp(16px, 1.8vw + 8px, 22px);
            font-weight: 700;
            color: #ffffff;
            word-break: break-all;
            text-align: center;
        }

        /* Configuration Forms */
        .config-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 24px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label.group-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Custom Slider */
        .slider-wrapper {
            display: flex;
            align-items: center;
            gap: 16px;
            background: var(--bg-base);
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            padding: 12px 16px;
        }

        .slider-wrapper input[type="range"] {
            flex-grow: 1;
            accent-color: var(--accent-primary);
            cursor: pointer;
            height: 4px;
            border-radius: 2px;
            background: var(--border-subtle);
        }

        .slider-value {
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 14px;
            color: #ffffff;
            min-width: 24px;
            text-align: right;
        }

        /* Checkbox Toggles */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-base);
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            padding: 12px 16px;
            cursor: pointer;
            user-select: none;
            transition: border-color 0.15s ease;
        }

        .checkbox-container:hover {
            border-color: var(--text-secondary);
        }

        .checkbox-container input {
            accent-color: var(--accent-primary);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .checkbox-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
        }

        /* Simple Strength Meter */
        .strength-container {
            margin-top: 20px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .strength-bar-wrapper {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            height: 3px;
        }

        .strength-segment {
            background: var(--border-subtle);
            border-radius: 1px;
            transition: background-color 0.3s ease;
        }

        .strength-meta {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        /* Inputs & Controls */
        input[type="password"], input[type="text"], select {
            background: var(--bg-base);
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            padding: 12px 14px;
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
            width: 100%;
        }

        input[type="password"]:focus, input[type="text"]:focus, select:focus {
            border-color: var(--accent-primary);
        }

        .action-row {
            display: flex;
            gap: 12px;
            margin-top: auto;
        }

        button {
            background: var(--accent-primary);
            color: #ffffff;
            font-family: var(--font-sans);
            font-weight: 600;
            border: none;
            border-radius: 6px;
            padding: 14px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.15s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            width: 100%;
        }

        button:hover {
            background: var(--accent-hover);
        }

        button.btn-secondary {
            background: var(--bg-base);
            color: var(--text-primary);
            border: 1px solid var(--border-subtle);
        }

        button.btn-secondary:hover {
            background: var(--bg-surface);
            border-color: var(--text-secondary);
        }

        /* Locked State view */
        .locked-vault-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px 0;
            gap: 20px;
            height: 100%;
        }

        /* Stacked Save Inputs */
        .save-form-stacked {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
            background: var(--bg-base);
            padding: 16px;
            border-radius: 6px;
            border: 1px solid var(--border-subtle);
        }

        .save-form-stacked .input-row-three {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }

        .vault-link {
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }

        .vault-link:hover {
            color: var(--accent-primary);
            text-decoration: underline;
        }

        .vault-item-meta {
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Vault Search Row & List */
        .vault-controls {
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 10px;
            margin-bottom: 20px;
        }

        .vault-controls input {
            padding: 10px 14px;
            font-size: 13px;
        }

        .vault-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            max-height: 480px;
            padding-right: 6px;
        }

        .vault-list::-webkit-scrollbar {
            width: 4px;
        }
        .vault-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .vault-list::-webkit-scrollbar-thumb {
            background: var(--border-subtle);
            border-radius: 2px;
        }

        .vault-item {
            background: var(--bg-base);
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .vault-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .vault-password-row-container {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
            align-items: center;
        }

        .vault-password-field {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 4px;
            padding: 8px 12px;
            font-family: var(--font-mono);
            font-size: 13px;
            color: var(--text-secondary);
            word-break: break-all;
            letter-spacing: 0.5px;
        }

        .vault-item-actions {
            display: flex;
            gap: 4px;
        }

        .icon-btn {
            background: transparent;
            color: var(--text-secondary);
            border: none;
            padding: 4px;
            cursor: pointer;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.1s ease;
            width: auto;
        }

        .icon-btn:hover {
            color: #ffffff;
        }

        .icon-btn-mini {
            background: transparent;
            color: var(--text-secondary);
            border: none;
            cursor: pointer;
            padding: 2px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn-mini:hover {
            color: #ffffff;
        }

        .error-msg {
            color: var(--status-alert);
            font-size: 12px;
            margin-top: 8px;
            text-align: center;
            font-weight: 500;
        }

        /* Toast Container */
        .toast-container {
            position: fixed;
            bottom: 32px;
            right: 48px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 100;
            pointer-events: none;
        }

        .toast {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
            animation: toastIn 0.2s ease forwards, toastOut 0.2s ease 2.8s forwards;
            pointer-events: auto;
        }

        .toast.toast-error {
            border-color: var(--status-alert);
        }

        /* Modal Structure */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 90;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 24px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 16px;
            transform: scale(0.98);
            transition: transform 0.15s ease;
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal-title {
            font-size: 14px;
            font-weight: 600;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .modal-buttons button {
            width: auto;
        }

        .hidden {
            display: none !important;
        }

        /* Footers */
        footer {
            width: 100%;
            padding: 20px 48px;
            text-align: center;
            font-size: 11px;
            color: var(--text-secondary);
            border-top: 1px solid var(--border-subtle);
            background: var(--bg-surface);
        }

        /* ------------------ RESPONSIVE BREAKPOINTS ------------------ */

        @media (max-width: 1024px) {
            main {
                grid-template-columns: 1fr;
                gap: 24px;
                padding: 24px;
            }
            header {
                padding: 20px 24px;
            }
            .toast-container {
                right: 50%;
                transform: translateX(50%);
                width: 90%;
                max-width: 400px;
            }
            .toast {
                width: 100%;
                justify-content: center;
            }
        }

        @media (max-width: 768px) {
            .panel {
                padding: 24px;
            }
            .password-workspace {
                padding: 20px;
                min-height: 120px;
            }
            header {
                padding: 16px 20px;
            }
            .logo {
                font-size: 16px;
            }
            .status-badge {
                font-size: 10px;
                padding: 4px 8px;
            }
            .save-form-stacked .input-row-three {
                grid-template-columns: 1fr;
                gap: 12px;
            }
        }

        @media (max-width: 480px) {
            main {
                padding: 16px 12px;
                gap: 16px;
            }
            .panel {
                padding: 16px;
                border-radius: 6px;
            }
            .options-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .checkbox-container {
                padding: 12px 16px;
            }
            .vault-controls {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            .vault-controls select {
                width: 100%;
            }
            .vault-controls div {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                width: 100%;
            }
            .vault-controls button {
                width: 100%;
            }
            .action-row {
                flex-direction: column;
                gap: 10px;
            }
            .vault-item {
                padding: 14px;
            }
            .vault-item-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
            .vault-item-actions {
                width: 100%;
                justify-content: flex-end;
                border-top: 1px solid var(--border-subtle);
                padding-top: 8px;
            }
            footer {
                padding: 16px 20px;
            }
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes toastOut {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-12px); }
        }
    </style>
</head>
<body>

<!-- Top Branding Header -->
<header>
    <div class="logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        LockBox
    </div>
    <div style="display: flex; align-items: center; gap: 12px;">
        <select id="theme-selector" onchange="changeTheme()" style="background: var(--bg-surface); color: var(--text-primary); border: 1px solid var(--border-subtle); border-radius: 4px; padding: 4px 8px; font-size: 12px; font-family: var(--font-sans); cursor: pointer; outline: none;">
            <option value="deep-slate">Deep Slate Dark</option>
            <option value="paper-light">Paper Light</option>
            <option value="tactical-amber">Tactical Amber</option>
            <option value="industrial-steel">Industrial Steel</option>
            <option value="organic-earth">Organic Earth</option>
        </select>
        <div class="status-badge" id="app-status-badge">
            Vault Locked
        </div>
    </div>
</header>

<!-- Main Split-Column Dashboard -->
<main>
    <!-- Left column: The Interactive Cryptographic Generator -->
    <section class="panel">
        <div class="panel-title">
            <span>Password Generator</span>
        </div>

        <!-- Custom visual output card -->
        <div class="password-workspace" id="main-workspace-card">
            <div class="password-display-wrapper">
                <span id="password-output" class="password-text">--------</span>
            </div>

            <!-- Password Entropy & Strength lighting -->
            <div class="strength-container">
                <div class="strength-bar-wrapper">
                    <div class="strength-segment" id="strength-seg-1"></div>
                    <div class="strength-segment" id="strength-seg-2"></div>
                    <div class="strength-segment" id="strength-seg-3"></div>
                    <div class="strength-segment" id="strength-seg-4"></div>
                </div>
                <div class="strength-meta">
                    <span>Strength: <span id="strength-label-text" style="transition: color 0.4s ease;">Low</span></span>
                    <span id="entropy-text">0 bits of entropy</span>
                </div>
            </div>
        </div>

        <!-- Length Slider -->
        <div class="config-grid">
            <div class="input-group">
                <label class="group-label">Password Length</label>
                <div class="slider-wrapper">
                    <input type="range" id="password-length" min="4" max="64" value="16" oninput="updateLengthDisplay(this.value)">
                    <span id="length-display" class="slider-value">16</span>
                </div>
            </div>

            <!-- Character Set Toggles -->
            <div class="input-group">
                <label class="group-label">Include Character Types</label>
                <div class="options-grid">
                    <label class="checkbox-container">
                        <span class="checkbox-label">Uppercase (A-Z)</span>
                        <input type="checkbox" id="opt-uppercase" checked onchange="generate()">
                    </label>
                    <label class="checkbox-container">
                        <span class="checkbox-label">Lowercase (a-z)</span>
                        <input type="checkbox" id="opt-lowercase" checked onchange="generate()">
                    </label>
                    <label class="checkbox-container">
                        <span class="checkbox-label">Numbers (0-9)</span>
                        <input type="checkbox" id="opt-numbers" checked onchange="generate()">
                    </label>
                    <label class="checkbox-container">
                        <span class="checkbox-label">Symbols (!@#)</span>
                        <input type="checkbox" id="opt-symbols" checked onchange="generate()">
                    </label>
                </div>
            </div>
        </div>

        <div class="action-row">
            <button onclick="generate()" style="flex: 2;">
                Generate
            </button>
            <button class="btn-secondary" onclick="copyPassword()" style="flex: 1;">
                Copy
            </button>
        </div>
    </section>

    <!-- Right column: The Secure Encrypted Vault Storage -->
    <section class="panel">
        <div class="panel-title">
            <span>Saved Vault</span>
        </div>

        <!-- UI State 1: Locked Vault Area -->
        <div id="locked-vault-ui" class="locked-vault-screen">
            <div>
                <p style="font-size: 13px; color: var(--text-secondary); max-width: 320px; margin: 0 auto 20px auto; line-height: 1.6;">
                    Unlock the local database using your Master Password to read, write, or export secure backups.
                </p>
            </div>

            <div class="input-group" style="width: 100%; text-align: left; max-width: 340px; margin: 0 auto 16px auto;">
                <label class="group-label">Master Password</label>
                <input type="password" id="master-password" placeholder="Enter password (min. 6 chars)" style="text-align: center;">
            </div>

            <button onclick="handleUnlock()" style="max-width: 340px; width: 100%; margin: 0 auto;">
                Unlock Vault
            </button>
            <div id="lock-error" class="error-msg" style="margin-top: 0; min-height: 0;"></div>
        </div>

        <!-- UI State 2: Unlocked Vault Area (Initially Hidden) -->

<script>
    let masterKey = null; 
    let currentPassword = '';
    let decryptedVault = {}; 
    let visiblePasswords = {}; 

    const PBKDF2_ITERATIONS = 100000;
    const SALT = new TextEncoder().encode("LockBoxStaticSaltUniqueString2026");

    // Auto Lock properties
    let autoLockTimer = null;
    let lastActivityTime = Date.now();
    let autoLockDuration = 300000; 

    // Initialize password generation on load
    window.addEventListener('DOMContentLoaded', () => {
        generate();
    });

    // Derive cryptographic PBKDF2 AES-GCM-256 key

    // Include security.js functions
    const MAX_FAILED_ATTEMPTS = 3;
    const BASE_COOLDOWN_MS = 30000;

    function getFailedAttempts() {
        return parseInt(localStorage.getItem("lockbox_failed_attempts") || "0", 10);
    }

    function setFailedAttempts(count) {
        localStorage.setItem("lockbox_failed_attempts", count.toString());
    }

    function getLockoutEndTime() {
        return parseInt(localStorage.getItem("lockbox_lockout_end_time") || "0", 10);
    }

    function setLockoutEndTime(time) {
        localStorage.setItem("lockbox_lockout_end_time", time.toString());
    }

    function checkRateLimit() {
        const lockoutEndTime = getLockoutEndTime();
        if (Date.now() < lockoutEndTime) {
            const remainingTime = Math.ceil((lockoutEndTime - Date.now()) / 1000);
            throw new Error(`Too many failed attempts. Try again in ${remainingTime} seconds.`);
        }
    }

    function recordFailedAttempt() {
        let attempts = getFailedAttempts() + 1;
        setFailedAttempts(attempts);

        if (attempts >= MAX_FAILED_ATTEMPTS) {
            const multiplier = Math.pow(2, attempts - MAX_FAILED_ATTEMPTS);
            const cooldown = BASE_COOLDOWN_MS * multiplier;
            setLockoutEndTime(Date.now() + cooldown);
            throw new Error(`Too many failed attempts. Try again in ${cooldown / 1000} seconds.`);
        }
    }

    function resetRateLimit() {
        setFailedAttempts(0);
        setLockoutEndTime(0);
    }

    async function verifyMasterPassword(passwordInput) {
        checkRateLimit();

        const storedHash = localStorage.getItem("lockbox_master_hash");
        const storedSaltBase64 = localStorage.getItem("lockbox_master_salt");

        if (!storedHash || !storedSaltBase64) {
            await setMasterPassword(passwordInput);
            resetRateLimit();
            return await deriveKey(passwordInput, getStoredSalt());
        }

        const salt = Uint8Array.from(atob(storedSaltBase64), c => c.charCodeAt(0));

        const hash = await hashPassword(passwordInput, salt);

        if (hash === storedHash) {
            resetRateLimit();
            return await deriveKey(passwordInput, salt);
        } else {
            recordFailedAttempt();
            throw new Error("Invalid master password.");
        }
    }

    async function setMasterPassword(password) {
        const salt = window.crypto.getRandomValues(new Uint8Array(16));
        const saltBase64 = btoa(String.fromCharCode.apply(null, salt));

        const hash = await hashPassword(password, salt);

        localStorage.setItem("lockbox_master_hash", hash);
        localStorage.setItem("lockbox_master_salt", saltBase64);
    }

    async function hashPassword(password, salt) {
        const encoder = new TextEncoder();
        const baseKey = await window.crypto.subtle.importKey(
            "raw",
            encoder.encode(password),
            "PBKDF2",
            false,
            ["deriveBits"]
        );

        const hashBuffer = await window.crypto.subtle.deriveBits(
            {
                name: "PBKDF2",
                salt: salt,
                iterations: 100000,
                hash: "SHA-256"
            },
            baseKey,
            256
        );

        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
    }

    function getStoredSalt() {
        const storedSaltBase64 = localStorage.getItem("lockbox_master_salt");
        if(storedSaltBase64) {
            return Uint8Array.from(atob(storedSaltBase64), c => c.charCodeAt(0));
        }
        return null;
    }

    async function deriveKey(passwordString, salt = SALT) {
        const encoder = new TextEncoder();
        const baseKey = await window.crypto.subtle.importKey(
            "raw",
            encoder.encode(passwordString),
            "PBKDF2",
            false,
            ["deriveKey"]
        );

        return await window.crypto.subtle.deriveKey(
            {
                name: "PBKDF2",
                salt: salt,
                iterations: PBKDF2_ITERATIONS,
                hash: "SHA-256"
            },
            baseKey,
            { name: "AES-GCM", length: 256 },
            false,
            ["encrypt", "decrypt"]
        );
    }

    async function handleUnlock() {
        const passwordInput = document.getElementById('master-password').value;
        const errorDiv = document.getElementById('lock-error');
        errorDiv.textContent = '';

        if (!passwordInput || passwordInput.length < 6) {
            errorDiv.textContent = 'Master password must be at least 6 characters.';
            return;
        }

        try {
            masterKey = await verifyMasterPassword(passwordInput);
            await loadVault();

            // Toggle Vault UI Elements
            document.getElementById('locked-vault-ui').classList.add('hidden');
            document.getElementById('unlocked-vault-ui').classList.remove('hidden');
            document.getElementById('master-password').value = ''; 
            
            // Update Navbar status badge
            const badgeEl = document.getElementById('app-status-badge');
            badgeEl.textContent = "Vault Unlocked";
            badgeEl.classList.add('unlocked');

            showToast('Vault database unlocked');
            resetActivityTimer();
            startAutoLockWatcher();
        } catch (e) {
            console.error(e);
            if (e.message.startsWith("Too many failed attempts.") || e.message === "Invalid master password.") {
                errorDiv.textContent = e.message;
            } else {
                errorDiv.textContent = 'Failed to unlock vault. Password incorrect or storage corrupted.';
            }
        }
    }

    function updateLengthDisplay(value) {
        document.getElementById('length-display').textContent = value;
        generate();
    }

    // Modulo Bias Elimination CSPRNG Generator
    function generatePassword(length, options) {
        const uppercase = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const lowercase = "abcdefghijklmnopqrstuvwxyz";
        const digits = "0123456789";
        const symbols = "!@#$%^&*()_-+=<>?/[]{}|";
        
        let allChars = "";
        let result = [];

        if (options.uppercase) { allChars += uppercase; result.push(getRandomCharFromSet(uppercase)); }
        if (options.lowercase) { allChars += lowercase; result.push(getRandomCharFromSet(lowercase)); }
        if (options.numbers) { allChars += digits; result.push(getRandomCharFromSet(digits)); }
        if (options.symbols) { allChars += symbols; result.push(getRandomCharFromSet(symbols)); }

        if (allChars.length === 0) return "";

        const poolLength = allChars.length;
        const remainingLength = length - result.length;

        if (remainingLength > 0) {
            const randomBytes = new Uint8Array(remainingLength * 2);
            window.crypto.getRandomValues(randomBytes);
            
            let byteIndex = 0;
            const maxUnbiasedValue = 256 - (256 % poolLength);

            for (let i = 0; i < remainingLength; i++) {
                while (true) {
                    if (byteIndex >= randomBytes.length) {
                        window.crypto.getRandomValues(randomBytes);
                        byteIndex = 0;
                    }
                    const val = randomBytes[byteIndex++];
                    if (val < maxUnbiasedValue) {
                        result.push(allChars[val % poolLength]);
                        break;
                    }
                }
            }
        }
        
        shuffleArray(result);
        return result.slice(0, length).join('');
    }

    function getRandomCharFromSet(set) {
        const bytes = new Uint8Array(1);
        const maxUnbiasedValue = 256 - (256 % set.length);
        while (true) {
            window.crypto.getRandomValues(bytes);
            if (bytes[0] < maxUnbiasedValue) {
                return set[bytes[0] % set.length];
            }
        }
    }

    function shuffleArray(array) {
        const randomValues = new Uint32Array(array.length);
        window.crypto.getRandomValues(randomValues);
        for (let i = array.length - 1; i > 0; i--) {
            const j = randomValues[i] % (i + 1);
            const temp = array[i];
            array[i] = array[j];
            array[j] = temp;
        }
    }

    // Generator function
    function generate() {
        const length = parseInt(document.getElementById('password-length').value);
        const options = {
            uppercase: document.getElementById('opt-uppercase').checked,
            lowercase: document.getElementById('opt-lowercase').checked,
            numbers: document.getElementById('opt-numbers').checked,
            symbols: document.getElementById('opt-symbols').checked
        };

        currentPassword = generatePassword(length, options);
        document.getElementById('password-output').textContent = currentPassword || "Select character sets...";
        
        // Auto pre-fill password input in save form if unlocked
        const savePasswordInput = document.getElementById('save-password');
        if (savePasswordInput) {
            savePasswordInput.value = currentPassword;
        }
        
        updateStrengthMeter(currentPassword, options);
    }

    function calculateEntropy(password, options) {
        if (!password) return 0;
        let poolSize = 0;
        if (options.uppercase) poolSize += 26;
        if (options.lowercase) poolSize += 26;
        if (options.numbers) poolSize += 10;
        if (options.symbols) poolSize += 23; 

        if (poolSize === 0) return 0;
        return Math.round(password.length * Math.log2(poolSize));
    }

    function updateStrengthMeter(password, options) {
        const entropy = calculateEntropy(password, options);
        const entropyTextEl = document.getElementById('entropy-text');
        const statusTextEl = document.getElementById('strength-label-text');
        const cardBorderEl = document.getElementById('main-workspace-card');
        
        entropyTextEl.textContent = `${entropy} bits of entropy`;

        // Clear segment styles
        const segments = [
            document.getElementById('strength-seg-1'),
            document.getElementById('strength-seg-2'),
            document.getElementById('strength-seg-3'),
            document.getElementById('strength-seg-4')
        ];
        segments.forEach(seg => seg.style.backgroundColor = '');

        let score = 0;
        let label = 'Low';
        let color = '#ef4444'; // Red

        if (entropy >= 28) { score = 1; label = 'Weak'; color = '#f97316'; }
        if (entropy >= 45) { score = 2; label = 'Medium'; color = '#eab308'; }
        if (entropy >= 60) { score = 3; label = 'Strong'; color = '#2563eb'; } // Trustworthy Blue
        if (entropy >= 80) { score = 4; label = 'Excellent'; color = '#10b981'; } // Standard Green

        statusTextEl.textContent = label;
        statusTextEl.style.color = color;
        
        // Add dynamic border shadow based on password strength
        cardBorderEl.style.borderColor = color + '40'; // 25% opacity

        for (let i = 0; i < score; i++) {
            segments[i].style.backgroundColor = color;
        }
    }

    function copyPassword() {
        if (!currentPassword) return;
        navigator.clipboard.writeText(currentPassword);
        showToast('Password copied to clipboard');
    }

    // Cryptographic Vault Store Encryption
    async function encryptData(plaintext) {
        const iv = window.crypto.getRandomValues(new Uint8Array(12));
        const encoded = new TextEncoder().encode(plaintext);
        const ciphertext = await window.crypto.subtle.encrypt(
            { name: "AES-GCM", iv: iv },
            masterKey,
            encoded
        );

        // Combine IV & Ciphertext
        const combined = new Uint8Array(iv.length + ciphertext.byteLength);
        combined.set(iv, 0);
        combined.set(new Uint8Array(ciphertext), iv.length);

        return btoa(String.fromCharCode.apply(null, combined));
    }

    async function decryptData(cipherBase64) {
        const binaryString = atob(cipherBase64);
        const combined = new Uint8Array(binaryString.length);
        for (let i = 0; i < binaryString.length; i++) {
            combined[i] = binaryString.charCodeAt(i);
        }

        const iv = combined.slice(0, 12);
        const ciphertext = combined.slice(12);

        const decrypted = await window.crypto.subtle.decrypt(
            { name: "AES-GCM", iv: iv },
            masterKey,
            ciphertext
        );

        return new TextDecoder().decode(decrypted);
    }

    async function loadVault() {
        const ciphertext = localStorage.getItem('lockbox_encrypted_vault');
        if (!ciphertext) {
            decryptedVault = {};
            updateVaultList();
            return;
        }

        try {
            const rawJSON = await decryptData(ciphertext);
            decryptedVault = JSON.parse(rawJSON);
            
            // Migrate old formats (strings) to new format (objects)
            let mutated = false;
            Object.keys(decryptedVault).forEach(key => {
                if (typeof decryptedVault[key] === 'string') {
                    decryptedVault[key] = {
                        website: key,
                        username: '',
                        password: decryptedVault[key]
                    };
                    mutated = true;
                }
            });
            if (mutated) {
                await saveVault();
            }

            updateVaultList();
        } catch (e) {
            throw new Error("Incorrect master password or corrupted storage.");
        }
    }

    async function saveVault() {
        const rawJSON = JSON.stringify(decryptedVault);
        const ciphertext = await encryptData(rawJSON);
        localStorage.setItem('lockbox_encrypted_vault', ciphertext);
    }

    async function saveVaultRecord() {
        const websiteInput = document.getElementById('save-website').value.trim();
        const usernameInput = document.getElementById('save-username').value.trim();
        const passwordInput = document.getElementById('save-password').value.trim();
        const error = document.getElementById('save-error');
        error.textContent = '';

        if (!websiteInput) {
            error.textContent = 'Please enter a website or service label.';
            return;
        }

        if (!passwordInput) {
            error.textContent = 'Please enter or generate a password.';
            return;
        }

        const id = Date.now().toString();
        
        decryptedVault[id] = {
            website: websiteInput,
            username: usernameInput,
            password: passwordInput
        };

        await saveVault();
        document.getElementById('save-website').value = '';
        document.getElementById('save-username').value = '';
        document.getElementById('save-password').value = currentPassword;
        
        updateVaultList();
        showToast('Password saved to vault');
    }

    function toggleViewPassword(id) {
        visiblePasswords[id] = !visiblePasswords[id];
        updateVaultList();
    }

    // Copy actions
    function copyVaultUsername(id) {
        navigator.clipboard.writeText(decryptedVault[id].username);
        showToast('Username copied');
    }

    function copyVaultPassword(id) {
        navigator.clipboard.writeText(decryptedVault[id].password);
        showToast('Password copied');
    }

    // Modal Edit actions
    function editRecord(id) {
        const record = decryptedVault[id];
        document.getElementById('edit-record-id').value = id;
        document.getElementById('edit-website').value = record.website;
        document.getElementById('edit-username').value = record.username || '';
        document.getElementById('edit-password').value = record.password;
        document.getElementById('edit-modal').classList.add('active');
    }

    function closeEditModal() {
        document.getElementById('edit-modal').classList.remove('active');
    }

    async function saveEditRecord() {
        const id = document.getElementById('edit-record-id').value;
        const websiteVal = document.getElementById('edit-website').value.trim();
        const usernameVal = document.getElementById('edit-username').value.trim();
        const passwordVal = document.getElementById('edit-password').value.trim();
        
        if (!websiteVal) {
            showToast('Website title cannot be empty', true);
            return;
        }
        if (!passwordVal) {
            showToast('Password cannot be empty', true);
            return;
        }

        decryptedVault[id] = {
            website: websiteVal,
            username: usernameVal,
            password: passwordVal
        };

        await saveVault();
        updateVaultList();
        closeEditModal();
        showToast('Vault record updated');
    }

    async function deleteEntry(id) {
        const record = decryptedVault[id];
        if (confirm(`Delete saved password for "${record.website}"? This action is permanent.`)) {
            delete decryptedVault[id];
            delete visiblePasswords[id];
            await saveVault();
            updateVaultList();
            showToast('Item deleted');
        }
    }

    function exportVault() {
        const ciphertext = localStorage.getItem('lockbox_encrypted_vault');
        if (!ciphertext) {
            showToast('Your vault is currently empty', true);
            return;
        }

        const data = {
            exportVersion: 2, 
            exportDate: new Date().toISOString(),
            encryptedData: ciphertext
        };

        const jsonString = JSON.stringify(data, null, 2);
        const blob = new Blob([jsonString], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `LockBox_Backup_${new Date().toISOString().split('T')[0]}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('Secure vault backup downloaded');
    }

    function triggerImport() {
        document.getElementById('import-file').click();
    }

    async function importVault(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async function(e) {
            try {
                const importedData = JSON.parse(e.target.result);
                if (!importedData.encryptedData) {
                    showToast('Invalid backup file formatting', true);
                    return;
                }

                const rawJSON = await decryptData(importedData.encryptedData);
                const parsed = JSON.parse(rawJSON);

                // Migrate and merge imported data
                Object.keys(parsed).forEach(key => {
                    const record = parsed[key];
                    if (typeof record === 'string') {
                        decryptedVault[Date.now() + Math.random().toString()] = {
                            website: key,
                            username: '',
                            password: record
                        };
                    } else {
                        decryptedVault[key] = record;
                    }
                });

                await saveVault();
                updateVaultList();
                showToast('Import completed successfully!');
            } catch (err) {
                showToast('Failed to import vault. Master password mismatch.', true);
                console.error(err);
            }
        };
        reader.readAsText(file);
        event.target.value = ''; 
    }

    function getFormattedUrl(inputUrl) {
        if (!inputUrl) return '#';
        if (inputUrl.startsWith('http://') || inputUrl.startsWith('https://')) {
            return inputUrl;
        }
        return `https://${inputUrl}`;
    }

    function updateVaultList() {
        const list = document.getElementById('vault-list');
        const searchVal = document.getElementById('vault-search').value.toLowerCase();
        list.innerHTML = '';

        const keys = Object.keys(decryptedVault).filter(id => {
            const record = decryptedVault[id];
            return record.website.toLowerCase().includes(searchVal) || 
                   (record.username && record.username.toLowerCase().includes(searchVal));
        });
        
        if (keys.length === 0) {
            list.innerHTML = `<div style="color: var(--text-secondary); text-align: center; font-size: 13px; padding: 32px;">${Object.keys(decryptedVault).length === 0 ? "Vault database empty" : "No results match search query"}</div>`;
            return;
        }

        keys.forEach(id => {
            const record = decryptedVault[id];
            const isVisible = !!visiblePasswords[id];
            const displayPass = isVisible ? record.password : "••••••••••••••••";
            const targetUrl = getFormattedUrl(record.website);
            const item = document.createElement('div');
            item.className = 'vault-item';
            
            item.innerHTML = `
                <div class="vault-item-header">
                    <div>
                        <a href="${escapeHTML(targetUrl)}" target="_blank" class="vault-link" title="Open website">${escapeHTML(record.website)}</a>
                        ${record.username ? `
                            <div class="vault-item-meta" style="margin-top: 4px;">
                                <span>User: ${escapeHTML(record.username)}</span>
                                <button class="icon-btn-mini" onclick="copyVaultUsername('${escapeJS(id)}')" title="Copy username">
                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                                </button>
                            </div>` : ''}
                    </div>
                    <div class="vault-item-actions">
                        <button class="icon-btn" onclick="editRecord('${escapeJS(id)}')" title="Edit Record">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                        </button>
                        <button class="icon-btn delete-btn" onclick="deleteEntry('${escapeJS(id)}')" title="Delete">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        </button>
                    </div>
                </div>
                <div class="vault-password-row-container">
                    <div class="vault-password-field">${escapeHTML(displayPass)}</div>
                    <div style="display: flex; gap: 4px;">
                        <button class="icon-btn" onclick="toggleViewPassword('${escapeJS(id)}')" title="${isVisible ? 'Hide' : 'Reveal'}">
                            ${isVisible ? 
                                `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>` : 
                                `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`
                            }
                        </button>
                        <button class="icon-btn" onclick="copyVaultPassword('${escapeJS(id)}')" title="Copy password">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        </button>
                    </div>
                </div>
            `;
            list.appendChild(item);
        });
    }

    function lockVault() {
        masterKey = null;
        decryptedVault = {};
        visiblePasswords = {};
        
        document.getElementById('unlocked-vault-ui').classList.add('hidden');
        document.getElementById('locked-vault-ui').classList.remove('hidden');
        
        const badgeEl = document.getElementById('app-status-badge');
        badgeEl.textContent = "Vault Locked";
        badgeEl.classList.remove('unlocked');

        stopAutoLockWatcher();
        showToast('Vault locked');
    }

    // Auto-Lock Timer Logic
    function updateAutoLockSetting(value) {
        autoLockDuration = parseInt(value);
        resetActivityTimer();
        showToast(`Auto-lock set to ${value === '0' ? 'Never' : document.getElementById('auto-lock-select').options[document.getElementById('auto-lock-select').selectedIndex].text.replace(' auto-lock', '')}`);
    }

    function resetActivityTimer() {
        lastActivityTime = Date.now();
    }

    function checkInactivity() {
        if (autoLockDuration === 0 || !masterKey) return;
        
        if (Date.now() - lastActivityTime >= autoLockDuration) {
            lockVault();
        }
    }

    function startAutoLockWatcher() {
        const events = ['mousemove', 'keydown', 'mousedown', 'touchstart', 'scroll'];
        events.forEach(evt => window.addEventListener(evt, resetActivityTimer, true));
        
        autoLockTimer = setInterval(checkInactivity, 10000); 
    }

    function stopAutoLockWatcher() {
        const events = ['mousemove', 'keydown', 'mousedown', 'touchstart', 'scroll'];
        events.forEach(evt => window.removeEventListener(evt, resetActivityTimer, true));
        
        if (autoLockTimer) {
            clearInterval(autoLockTimer);
            autoLockTimer = null;
        }
    }

    // Luxury Notification Toast
    function showToast(message, isError = false) {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `toast ${isError ? 'toast-error' : ''}`;
        
        const icon = isError ? 
            `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>` : 
            `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;

        toast.innerHTML = `${icon} <span>${message}</span>`;
        container.appendChild(toast);

        setTimeout(() => {
            if (toast.parentNode) {
                container.removeChild(toast);
            }
        }, 3000);
    }

    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, 
            tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
        );
    }


    function escapeJS(str) {
        return str.replace(/'/g, "\\'");
    }

    function changeTheme() {
        const themeSelect = document.getElementById('theme-selector');
        if(!themeSelect) return;
        const theme = themeSelect.value;
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('lockbox_theme', theme);
    }

    // Load saved theme
    window.addEventListener('DOMContentLoaded', () => {
        const savedTheme = localStorage.getItem('lockbox_theme');
        if (savedTheme) {
            document.documentElement.setAttribute('data-theme', savedTheme);
            const themeSelect = document.getElementById('theme-selector');
            if (themeSelect) {
                themeSelect.value = savedTheme;
            }
        }
    });

</script>
</body>
</html>
